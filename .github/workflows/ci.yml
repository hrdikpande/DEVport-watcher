name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Build application bundle
        run: ./Scripts/build_app.sh
