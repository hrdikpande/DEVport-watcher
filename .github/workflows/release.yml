name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      HAS_CERT: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Test
        run: swift test
      # Optional secrets: without them the workflow still publishes a clearly labelled unsigned build.
      - name: Import Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Write notary key
        if: env.HAS_NOTARY == 'true'
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
      - name: Build, sign, notarize
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary.p8
        run: VERSION="${GITHUB_REF_NAME#v}" ./Scripts/release.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.dmg dist/SHA256SUMS.txt \
            --title "Ports ${GITHUB_REF_NAME#v}" --notes-file dist/release-notes.md
